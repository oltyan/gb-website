name: mm-grogblossoms
kind: web-app
brand: grog-blossoms
visual-system: tavern-noir
public-url: https://grogblossoms.com
runtime: python3.12
deploys-to: mycelium
exposure: cloudflare-tunnel
depends-on:
  - mm-sporekles  # CSS tokens + asset CDN
notes: |
  Self-hosted Flask CMS + public site. SQLite, single-container app +
