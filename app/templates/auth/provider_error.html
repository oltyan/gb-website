{% extends "base.html" %}
{% block title %}Sign-in Failed — The Grog Blossoms{% endblock %}
{% block content %}
  <section class="px-6 py-24 max-w-2xl mx-auto">
    <h1 class="font-hand text-6xl text-accent-red sketch-underline inline-block">Sign-in Failed</h1>
    <p class="mt-8 font-body-lg text-on-surface-variant">
      The sign-in service turned us away: <code class="font-mono text-accent-amber">{{ error }}</code>.
    </p>
    {% if description %}<p class="mt-4 text-sm text-on-surface-variant">{{ description }}</p>{% endif %}
    <a href="{{ url_for('public.home') }}" class="inline-block mt-12 px-6 py-3 bg-accent-red text-white font-hand uppercase">Back to Port</a>
  </section>
{% endblock %}
