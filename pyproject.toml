[project]
name = "gb-website"
version = "0.1.0"
description = "The Grog Blossoms — CMS + public site"
requires-python = ">=3.12"
dependencies = [
  "flask>=3.0,<4",
  "flask-sqlalchemy>=3.1",
  "flask-migrate>=4.0",
  "flask-wtf>=1.2",
  "flask-login>=0.6",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.13",
  "authlib>=1.3",
  "requests>=2.31",
  "markdown>=3.6",
  "python-dotenv>=1.0",
  "gunicorn>=22.0",
  "feedgen>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-flask>=1.3",
  "ruff>=0.5",
  "black>=24.0",
  "freezegun>=1.5",
  "responses>=0.25",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = ["."]

# Without this, setuptools auto-discovery sees `app/`, `docker/`, and
# `migrations/` as three competing top-level packages and refuses to
# install (Multiple top-level packages discovered in flat-layout). Only
# `app` is actually a Python package — `docker/` holds Dockerfile assets
# and `migrations/` is Alembic's env, neither importable.
[tool.setuptools.packages.find]
include = ["app*"]
