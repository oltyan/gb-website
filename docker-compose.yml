services:
  app:
    # Local build on mycelium — no registry round-trip (matches the
    # mm-sporekles pattern). `build:` is read by `docker compose build`
    # in Jenkinsfile.deploy; `image:` is the tag applied so `up -d` can
    # find the artifact + so we get layer caching across deploys.
    build: .
    image: gb-website:latest
    container_name: gb-website-app
    # Rendered by Jenkinsfile.deploy on every build from withCredentials.
    # Path is relative to the compose working directory (the Jenkins
    # workspace at deploy time; the repo root for local debugging).
    env_file: secrets.env
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=sqlite:////data/grogblossoms.db
      - SESSION_COOKIE_SECURE=true
    volumes:
      # Named volume — Docker-managed, portable across hosts (Mac/Linux/EC2),
      # no host filesystem permissions or path-sharing requirements. SQLite
      # DB lives at /data/grogblossoms.db inside the container; backups use
      # `docker exec sqlite3 .backup` + `docker cp` to extract a snapshot
      # (see scripts/backup.sh).
      - gb_data:/data
    restart: unless-stopped
    networks:
      - default
      - shared-tunnel
    # mm-homebody discovers this container via these labels and registers
    # it in the shared Cloudflare tunnel's ingress. Zone grogblossoms.com
    # is in Route 53 (not Cloudflare), so:
    #   - Homebody pushes the cloudflared ingress (hostname -> http://gb-website-app:8000) — works
    #   - Homebody's CF-DNS step is a no-op for this zone (logs an error
    #     until per-zone DNS opt-out lands upstream — see runbook). The
    #     DNS record itself is a manual CNAME in Route 53 pointing at
    #     <tunnel-uuid>.cfargotunnel.com.
    # Prerequisite: grogblossoms.com must be in mm-homebody/rules.yml
    # allowed_zones, otherwise homebody rejects this registration.
    labels:
      homebody.enable: "true"
      homebody.hostname: "www.grogblossoms.com"
      homebody.service: "http://gb-website-app:8000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  gb_data:

networks:
  shared-tunnel:
    external: true
