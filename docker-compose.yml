# Project name is pinned to match the existing data volume,
# gb-website-deploy_gb_data. Do not change it: a different name makes
# compose create a new, empty volume.
name: gb-website-deploy

services:
  app:
    # The production image is built by Jenkins (EC2), pushed to ECR, and
    # pulled on mycelium by /opt/gb-website/deploy-pull.sh, which retags it
    # to the local name in `image:` below before `docker compose up`.
    # `build:` is for local development and manual deploys only.
    build: .
    image: gb-website:latest
    container_name: gb-website-app
    # Maintained by hand on mycelium (never committed). Jenkins runs on EC2
    # and cannot write it; see docs/runbook-deploy.md, "Rotate a secret".
    # Path is relative to the compose working directory.
    env_file: secrets.env
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=sqlite:////data/grogblossoms.db
      - SESSION_COOKIE_SECURE=true
    volumes:
      # Named volume — Docker-managed, portable across hosts (Mac/Linux/EC2),
      # no host filesystem permissions or path-sharing requirements. SQLite
      # DB lives at /data/grogblossoms.db inside the container; backups use
      # `docker exec sqlite3 .backup` + `docker cp` to extract a snapshot
      # (see scripts/backup.sh).
      - gb_data:/data
    restart: unless-stopped
    networks:
      - default
      - shared-tunnel
    # mm-homebody discovers this container via these labels and registers
    # it in the shared Cloudflare tunnel's ingress (hostname ->
    # http://gb-website-app:8000). Zone grogblossoms.com is served by
    # Cloudflare DNS: www is a proxied Tunnel record, and the apex is a
    # proxied CNAME to www with a Cloudflare redirect rule (see
    # architecture.md, "DNS lives in Cloudflare").
    # Prerequisite: grogblossoms.com must be in mm-homebody/rules.yml
    # allowed_zones, otherwise homebody rejects this registration.
    labels:
      homebody.enable: "true"
      homebody.hostname: "www.grogblossoms.com"
      homebody.service: "http://gb-website-app:8000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  gb_data:

networks:
  shared-tunnel:
    external: true
